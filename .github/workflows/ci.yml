name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint charts/wlow

      - name: Template (smoke test)
        run: |
          helm template wlow charts/wlow \
            --set nats.url=nats://nats:4222 \
            --set runner.registry=ghcr.io/test/artifacts \
            --debug > /dev/null
